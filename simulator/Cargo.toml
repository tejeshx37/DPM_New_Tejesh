[package]
name = "simulator"
version = "0.25.1"
edition.workspace = true

[dependencies]
eframe = { version = "0.27.2", default-features = false, features = [
    "wayland",
    "x11",
    "wgpu",
    "default_fonts",
    "persistence",
    "puffin",
] }
egui-wgpu = "0.27.2"
wgpu = "0.19"
bytemuck = { version = "1.16", features = ["derive"] }
pollster = "0.3"
egui = { version = "0.27.2", features = ["rayon", "log"] }
egui_plot = "0.27.2"
egui_extras = { version = "0.27.2", features = ["svg"] }
ecolor = "0.27.2"
cgal = { workspace = true, features = ["serde"] }
cpd = { path = "../cpd", features = ["serde"] }
nalgebra = { workspace = true, features = ["serde-serialize"] }
serde.workspace = true
rayon.workspace = true
strum.workspace = true
strum_macros.workspace = true
enum-map = { workspace = true, features = ["serde"] }
paste.workspace = true
typed-builder.workspace = true
derive-getters.workspace = true
directories = "5.0.1"
rfd = "0.14.1"
lazy_static = "1.4.0"
indexmap = { version = "2.2.6", features = ["serde"] }
pathdiff = "0.2.1"
csv = "1.3.0"
sealed.workspace = true
fxhash.workspace = true
nalgebra-ext = { workspace = true, features = ["serde"] }
pot = "3.0.0"
envy = "0.4.2"
pretty_env_logger = "0.5.0"
function = { workspace = true, features = ["serde"] }
puffin.workspace = true
puffin_http = "0.16.0"
const_format = { version = "0.2.32", features = [
    "rust_1_64",
    "const_generics"
] }
uuid = { version = "1.8.0", features = ["fast-rng", "v4", "serde"] }
mesh = { workspace = true, features = ["serde"] }

[dev-dependencies]
test-case.workspace = true
